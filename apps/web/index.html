<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- US-019: title/description are the confirmed legalName+tagline and
         the already-approved Hero supporting copy verbatim (US-012) -
         no new claims invented here. %VITE_APP_URL% is Vite's built-in
         HTML env-replacement syntax: the production domain is supplied
         entirely via the environment, never hardcoded in source. -->
    <title>ASODEF S.A.S. | Trabajamos pensando en su bienestar.</title>
    <meta
      name="description"
      content="Acompañamos a personas, familias y organizaciones con una atención cercana, responsable y orientada a construir bienestar."
    />
    <link rel="canonical" href="%VITE_APP_URL%/" />

    <!-- US-077: favicon derived from the official isotipo
         (src/assets/asodef-logo-icon.webp), square-padded and exported
         at standard sizes - no redesign, just a canvas/export step. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ASODEF S.A.S." />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:title" content="ASODEF S.A.S. | Trabajamos pensando en su bienestar." />
    <meta
      property="og:description"
      content="Acompañamos a personas, familias y organizaciones con una atención cercana, responsable y orientada a construir bienestar."
    />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASODEF S.A.S. | Trabajamos pensando en su bienestar." />
    <meta
      name="twitter:description"
      content="Acompañamos a personas, familias y organizaciones con una atención cercana, responsable y orientada a construir bienestar."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og-image.webp" />

    <!-- Organization JSON-LD: only ASODEF_COMPANY's confirmed fields
         (packages/config/src/company.ts) - no aggregateRating, reviews,
         sameAs profiles, or geographic coverage, since none of those
         are confirmed facts. US-077: logo now included - the real
         official isotipo asset is available (it was not when this
         comment previously explained its absence). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ASODEF S.A.S.",
        "url": "%VITE_APP_URL%/",
        "email": "info@asodef.com.co",
        "logo": "%VITE_APP_URL%/icon-512.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cali",
          "addressCountry": "CO"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
