# US-037: minimal SPA-aware config for local Docker Compose
# verification - React Router routes (e.g. /pagos, /pagos/orden/:ref)
# have no matching file on disk; without the try_files fallback below,
# nginx's own default config 404s on every client-side route instead of
# serving index.html and letting the client-side router take over.
# Production Nginx config (real caching headers, TLS, the actual
# asodef.com.co reverse proxy) is US-039's own job.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
