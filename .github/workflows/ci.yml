name: CI

# US-036: every gate below must pass, in order, on every push/PR - the
# workflow fails (non-zero exit) the moment any step fails, and nothing
# here uses --no-verify or a skip flag. Dev-only placeholder secrets are
# generated fresh per run (openssl rand) - never a real credential, and
# explicitly masked before it is exported to subsequent steps.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20.19"
  PNPM_VERSION: "10.16.0"
  COMPOSE_PROJECT_NAME: "asodef-ci-github-${{ github.run_id }}-${{ github.run_attempt }}"
  CI_POSTGRES_DB: "asodef_ci_github"
  CI_POSTGRES_USER: "asodef_ci"
  CI_POSTGRES_PORT: "55433"
  CI_REDIS_PORT: "56379"
  REDIS_URL: "redis://127.0.0.1:56379"
  API_PORT: "3100"
  BOLD_MODE: "mock"
  NODE_ENV: "development"
  VITE_API_URL: "http://localhost:3100"
  VITE_APP_URL: "http://localhost:4173"
  PUBLIC_API_URL: "http://localhost:3100"
  PUBLIC_APP_URL: "http://localhost:4173"
  CORS_ORIGIN: "http://localhost:4173"
  ADMIN_ACCOUNT_EMAIL: "admin@asodef.com.co"
  ADMIN_RECOVERY_EMAIL: "asodefsas@gmail.com"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate dev-only placeholder secrets
        # Never real credentials, never printed - meaningless outside
        # this single ephemeral CI run. Exported via GITHUB_ENV so every
        # later step (test, build, the e2e API process) sees them.
        run: |
          set -Eeuo pipefail

          generate_masked_secret() {
            local name="$1"
            local value
            value="$(openssl rand -hex 32)"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          generate_masked_secret JWT_SECRET
          generate_masked_secret JWT_REFRESH_SECRET
          generate_masked_secret ENCRYPTION_KEY
          generate_masked_secret PASSWORD_RESET_TOKEN_SECRET
          generate_masked_secret CONTRACT_DOWNLOAD_TOKEN_SECRET

          e2e_admin_password="$(openssl rand -hex 24)"
          e2e_mfa_secret="$(node -e 'const {randomBytes}=require("node:crypto");const a="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";process.stdout.write([...randomBytes(32)].map((b)=>a[b&31]).join(""))')"
          e2e_recovery_codes="$(node -e 'const {randomBytes}=require("node:crypto");const a="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";const code=()=>{const v=[...randomBytes(12)].map((b)=>a[b%a.length]).join("");return `${v.slice(0,4)}-${v.slice(4,8)}-${v.slice(8)}`};process.stdout.write(Array.from({length:10},code).join(","))')"
          for value in "$e2e_admin_password" "$e2e_mfa_secret" "$e2e_recovery_codes"; do
            printf '::add-mask::%s\n' "$value"
          done
          IFS=',' read -ra e2e_recovery_code_values <<< "$e2e_recovery_codes"
          for value in "${e2e_recovery_code_values[@]}"; do
            printf '::add-mask::%s\n' "$value"
          done
          printf 'ASODEF_E2E_ADMIN_PASSWORD=%s\n' "$e2e_admin_password" >> "$GITHUB_ENV"
          printf 'ASODEF_E2E_ADMIN_MFA_SECRET=%s\n' "$e2e_mfa_secret" >> "$GITHUB_ENV"
          printf 'ASODEF_E2E_ADMIN_RECOVERY_CODES=%s\n' "$e2e_recovery_codes" >> "$GITHUB_ENV"

          postgres_password="$(openssl rand -hex 32)"
          database_url="postgresql://${CI_POSTGRES_USER}:${postgres_password}@127.0.0.1:${CI_POSTGRES_PORT}/${CI_POSTGRES_DB}?schema=public"
          printf '::add-mask::%s\n' "$postgres_password"
          printf '::add-mask::%s\n' "$database_url"
          printf 'CI_POSTGRES_PASSWORD=%s\n' "$postgres_password" >> "$GITHUB_ENV"
          printf 'DATABASE_URL=%s\n' "$database_url" >> "$GITHUB_ENV"

      - name: Prepare generated clients
        run: pnpm prepare:generated

      - name: Start isolated clean-install services
        run: >-
          docker compose
          --project-name "$COMPOSE_PROJECT_NAME"
          --file .github/compose.ci.yml
          up -d postgres redis

      - name: Wait for isolated clean-install services
        run: |
          set -Eeuo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --file .github/compose.ci.yml)
          for i in $(seq 1 30); do
            postgres_id="$("${compose[@]}" ps --quiet postgres)"
            redis_id="$("${compose[@]}" ps --quiet redis)"
            pg_status="$(docker inspect --format='{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || echo "starting")"
            redis_status="$(docker inspect --format='{{.State.Health.Status}}' "$redis_id" 2>/dev/null || echo "starting")"
            if [ "$pg_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
              echo "Postgres and Redis are healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres/Redis did not become healthy in time (postgres=$pg_status, redis=$redis_status)"
          "${compose[@]}" logs --no-color postgres redis
          exit 1

      - name: Verify clean migrations and repeatable seeds
        run: scripts/ci-database-check.sh

      - name: Start fresh isolated runtime services
        run: >-
          docker compose
          --project-name "$COMPOSE_PROJECT_NAME"
          --file .github/compose.ci.yml
          up -d postgres redis

      - name: Wait for isolated runtime services
        run: |
          set -Eeuo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --file .github/compose.ci.yml)
          for i in $(seq 1 30); do
            postgres_id="$("${compose[@]}" ps --quiet postgres)"
            redis_id="$("${compose[@]}" ps --quiet redis)"
            pg_status="$(docker inspect --format='{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || echo "starting")"
            redis_status="$(docker inspect --format='{{.State.Health.Status}}' "$redis_id" 2>/dev/null || echo "starting")"
            if [ "$pg_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
              echo "Postgres and Redis are healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres/Redis did not become healthy in time (postgres=$pg_status, redis=$redis_status)"
          "${compose[@]}" logs --no-color postgres redis
          exit 1

      - name: Apply runtime migrations
        run: pnpm --filter api prisma:deploy

      - name: Seed runtime data
        run: pnpm --filter api prisma:seed

      - name: Verify lint, strict types, tests, and production build
        run: pnpm ci:check

      - name: Build and inspect immutable runtime images
        run: scripts/ci-image-check.sh

      - name: Prepare guarded ephemeral E2E state
        # Tests intentionally exercise legal seed restoration. E2E state is
        # therefore prepared afterwards, through the real audited publication
        # workflow, so no test mutation can leave a current version in DRAFT.
        env:
          ASODEF_E2E_PREPARE: "true"
          ADMIN_MFA_REQUIRED: "true"
          NODE_ENV: development
        run: pnpm --filter api ci:prepare-e2e

      - name: Start the compiled API in the background
        env:
          ADMIN_MFA_REQUIRED: "true"
        run: nohup node apps/api/dist/main.js > api.log 2>&1 &

      - name: Wait for the API health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${API_PORT}/api/v1/health" > /dev/null; then
              echo "API is healthy."
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy in time"
          cat api.log || true
          exit 1

      - name: Start the built frontend preview in the background
        working-directory: apps/web
        run: nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > ../../web.log 2>&1 &

      - name: Wait for the frontend preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:4173/" > /dev/null; then
              echo "Frontend preview is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Frontend preview did not come up in time"
          cat web.log || true
          exit 1

      - name: Install Playwright's Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke test
        env:
          ADMIN_MFA_REQUIRED: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:4173"
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload API/web logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            api.log
            web.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture isolated service logs on failure
        if: failure()
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --file .github/compose.ci.yml \
            logs --no-color postgres redis > compose.log 2>&1 || true

      - name: Upload isolated service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-service-logs
          path: compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down only the isolated CI service stack
        if: always()
        run: |
          set -Eeuo pipefail
          if [ ! -f .github/compose.ci.yml ]; then
            echo "Isolated Compose definition is unavailable; no CI service could have started."
            exit 0
          fi
          export CI_POSTGRES_PASSWORD="${CI_POSTGRES_PASSWORD:-ci-cleanup-only-postgres-password}"
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --file .github/compose.ci.yml \
            down --volumes --remove-orphans
