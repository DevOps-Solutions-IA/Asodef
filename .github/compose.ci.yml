services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CI_POSTGRES_DB:?CI_POSTGRES_DB is required}
      POSTGRES_USER: ${CI_POSTGRES_USER:?CI_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?CI_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${CI_POSTGRES_PORT:?CI_POSTGRES_PORT is required}:5432"
    labels:
      com.asodef.purpose: prisma-clean-install-check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${CI_REDIS_PORT:?CI_REDIS_PORT is required}:6379"
    labels:
      com.asodef.purpose: prisma-clean-install-check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
